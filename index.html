<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Paper-Cut Dino Diorama</title>
    <style>
        body {
            margin: 0; overflow: hidden;
            background-color: #f4eee1;
            font-family: 'Courier New', Courier, monospace;
            touch-action: none;
        }
        #game-container { width: 100vw; height: 100vh; display: block; }
        #ui-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; display: flex; flex-direction: column;
            justify-content: space-between;
        }
        #score-board {
            text-align: right; padding: 20px 40px; font-size: 32px;
            font-weight: bold; color: #333; text-shadow: 2px 2px 0px rgba(0,0,0,0.1);
        }
        #game-over-screen {
            display: none; flex-direction: column; align-items: center;
            justify-content: center; position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(244, 238, 225, 0.7); pointer-events: auto;
        }
        .paper-text {
            font-size: 48px; font-weight: bold; color: #5d4a3e;
            background: #fff; padding: 20px 40px; border-radius: 5px;
            box-shadow: 4px 4px 10px rgba(0,0,0,0.2); margin-bottom: 20px;
        }
        .restart-btn {
            padding: 15px 30px; font-size: 24px; font-weight: bold;
            color: #fff; background: #7a8b5e; border: none;
            border-radius: 5px; cursor: pointer;
            box-shadow: 3px 3px 8px rgba(0,0,0,0.3); transition: transform 0.1s;
        }
        .restart-btn:active { transform: translate(2px, 2px); box-shadow: 1px 1px 4px rgba(0,0,0,0.3); }
        #start-prompt {
            position: absolute; top: 50%; width: 100%; text-align: center;
            font-size: 24px; color: #555; animation: pulse 1.5s infinite;
        }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
    <div id="game-container"></div>
    <div id="ui-layer">
        <div id="score-board">HI: <span id="hi-score">00000</span> | <span id="score">00000</span></div>
        <div id="start-prompt">Press SPACE or TAP to start</div>
        <div id="game-over-screen">
            <div class="paper-text">GAME OVER</div>
            <button class="restart-btn" id="restart-btn">Try Again</button>
        </div>
    </div>

    <script>
        // --- CUSTOM AUDIO SYSTEM ---
        const jumpSound = new Audio('assets/jump.mp3');
        const deadSound = new Audio('assets/dead.mp3');

        function playSound(type) {
            if (type === 'jump') {
                jumpSound.currentTime = 0;
                jumpSound.play().catch(e => console.log("Audio play blocked:", e));
            } else if (type === 'hit') {
                deadSound.currentTime = 0;
                deadSound.play().catch(e => console.log("Audio play blocked:", e));
            }
        }

        // --- TEXTURES ---
        const textureLoader = new THREE.TextureLoader();
        
        // Dino Assets
        const texDino1 = textureLoader.load('assets/dino-run-1.png');
        const texDino2 = textureLoader.load('assets/dino-run-2.png');
        const texDinoDead = textureLoader.load('assets/dino-dead.png');
        
        // Environment Assets
        const texCloud = textureLoader.load('assets/cloud.png');
        const texStar = textureLoader.load('assets/star.png');
        const texMoon = textureLoader.load('assets/moon.png');
        
        // Ground configuration (Repeating)
        const texGround = textureLoader.load('assets/ground-track.png');
        texGround.wrapS = THREE.RepeatWrapping;
        texGround.wrapT = THREE.RepeatWrapping;
        texGround.repeat.set(12, 1);

        // Bird Assets (for flapping animation)
        const texBirdUp = textureLoader.load('assets/bird-fly-up.png');
        const texBirdDown = textureLoader.load('assets/bird-fly-down.png');

        // Obstacle Configurations Map (Texture + Hitbox sizes)
        const obstacleTypes = [
            { tex: textureLoader.load('assets/cactus-small-single.png'), w: 0.8, h: 1.2, type: 'cactus' },
            { tex: textureLoader.load('assets/cactus-small-double.png'), w: 1.2, h: 1.2, type: 'cactus' },
            { tex: textureLoader.load('assets/cactus-large-single.png'), w: 1.0, h: 2.0, type: 'cactus' },
            { tex: textureLoader.load('assets/cactus-large-double.png'), w: 1.5, h: 2.0, type: 'cactus' },
            { tex: texBirdUp, w: 1.2, h: 0.8, type: 'bird' }
        ];

        function createPaperMat(texture) {
            return new THREE.MeshStandardMaterial({
                map: texture, transparent: true, alphaTest: 0.5,
                roughness: 0.8, metalness: 0.1, side: THREE.DoubleSide
            });
        }

        // --- GAME VARIABLES ---
        let scene, camera, renderer, dino, ground;
        let obstacles = [], clouds = [], stars = [];
        let isPlaying = false, isGameOver = false;
        let gameSpeed = 12, score = 0;
        let hiScore = localStorage.getItem('dinoHiScore') || 0;
        
        // Physics
        let dinoVelocityY = 0;
        const gravity = -100; 
        const jumpStrength = 35;
        let isJumping = false;
        const floorY = -2.0;
        const dinoHeight = 2.0;

        // UI
        const scoreEl = document.getElementById('score');
        const hiScoreEl = document.getElementById('hi-score');
        const gameOverScreen = document.getElementById('game-over-screen');
        hiScoreEl.innerText = String(hiScore).padStart(5, '0');

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0xf4eee1);

            // 2.5D Orthographic Camera
            const aspect = window.innerWidth / window.innerHeight;
            const frustum = 16;
            camera = new THREE.OrthographicCamera(
                frustum * aspect / -2, frustum * aspect / 2, frustum / 2, frustum / -2, 0.1, 100
            );
            camera.position.set(0, 2, 20);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = false;
            document.getElementById('game-container').appendChild(renderer.domElement);

            // Lighting for diorama depth
            scene.add(new THREE.AmbientLight(0xffffff, 0.6));
            const dirLight = new THREE.DirectionalLight(0xffffff, 0.9);
            dirLight.position.set(-6, 12, 10);
            dirLight.castShadow = false;
            scene.add(dirLight);

            // Shadow receiving backdrop
            const backdrop = new THREE.Mesh(
                new THREE.PlaneGeometry(100, 50),
                new THREE.MeshStandardMaterial({ color: 0xf4eee1, roughness: 1 })
            );
            backdrop.position.z = -5;
            backdrop.receiveShadow = false;
            scene.add(backdrop);

            createGameWorld();

            window.addEventListener('resize', onResize);
            window.addEventListener('keydown', handleInput);
            window.addEventListener('touchstart', handleInput, {passive: false});
            document.getElementById('restart-btn').addEventListener('click', resetGame);

            requestAnimationFrame(animate);
        }

        function createGameWorld() {
            // Ground (Reverted back to exact original ground position from your file)
            ground = new THREE.Mesh(new THREE.PlaneGeometry(100, 4), createPaperMat(texGround)); 
            ground.position.set(0, floorY - 1.0, 0);
            ground.receiveShadow = false;
            scene.add(ground);

            // Dino
            dino = new THREE.Mesh(new THREE.PlaneGeometry(2.0, dinoHeight), createPaperMat(texDino1));
            dino.position.set(-6, floorY + (dinoHeight / 2), 0.5);
            dino.castShadow = true;
            scene.add(dino);

            // The Moon
            const moon = new THREE.Mesh(new THREE.PlaneGeometry(3, 3), createPaperMat(texMoon));
            moon.position.set(15, 6, -4.8);
            moon.castShadow = true;
            scene.add(moon);

            // Generate Initial Scenery
            for(let i=0; i<15; i++) spawnStar();
            for(let i=0; i<4; i++) spawnCloud(true);
        }

        function spawnStar() {
            const size = 0.3 + Math.random() * 0.8; 
            const star = new THREE.Mesh(new THREE.PlaneGeometry(size, size), createPaperMat(texStar));
            star.position.set(
                (Math.random() * 60) - 30, 
                Math.random() * 6 + 2,     
                -4.5
            );
            star.castShadow = true;
            scene.add(star);
        }

        function spawnCloud(initial = false) {
            const width = 3 + Math.random() * 2;
            const height = width * 0.5;
            const cloud = new THREE.Mesh(new THREE.PlaneGeometry(width, height), createPaperMat(texCloud));
            
            const startX = initial ? (Math.random() * 40 - 20) : 25;
            cloud.position.set(startX, Math.random() * 4 + 2, -3); 
            cloud.castShadow = true;
            scene.add(cloud);
            clouds.push({ mesh: cloud, speed: (Math.random() * 0.5 + 0.2) });
            
            if(!initial && isPlaying) {
                setTimeout(spawnCloud, Math.random() * 4000 + 2000);
            }
        }

        function spawnObstacle() {
            if (!isPlaying) return;
            
            // Allow birds only after score > 300
            let availableTypes = obstacleTypes;
            if (score < 300) availableTypes = obstacleTypes.filter(o => o.type === 'cactus');
            
            const config = availableTypes[Math.floor(Math.random() * availableTypes.length)];
            const isBird = config.type === 'bird';
            const yPos = isBird ? (floorY + 1.5 + Math.random() * 2) : (floorY + config.h / 2 - 0.1);
            
            const obstacle = new THREE.Mesh(
                new THREE.PlaneGeometry(config.w, config.h),
                createPaperMat(config.tex)
            );
            obstacle.position.set(20, yPos, 0.5);
            obstacle.castShadow = true;
            obstacle.userData = { w: config.w, h: config.h, type: config.type }; 
            
            scene.add(obstacle);
            obstacles.push(obstacle);

            const nextTime = (Math.random() * 1200 + 800) / (gameSpeed / 12);
            setTimeout(spawnObstacle, nextTime);
        }

        // --- GAME LOGIC ---
        function handleInput(e) {
            if (e.type === 'touchstart') e.preventDefault();
            if (isGameOver) return;
            if (!isPlaying) { startGame(); return; }

            if ((e.code === 'Space' || e.type === 'touchstart') && !isJumping) {
                dinoVelocityY = jumpStrength;
                isJumping = true;
                playSound('jump');
            }
        }

        function startGame() {
            isPlaying = true; isGameOver = false; score = 0; gameSpeed = 12;
            document.getElementById('start-prompt').style.display = 'none';
            dino.material.map = texDino1;
            spawnObstacle();
            spawnCloud();
        }

        function gameOver() {
            isPlaying = false; isGameOver = true;
            dino.material.map = texDinoDead;
            playSound('hit');
            gameOverScreen.style.display = 'flex';
            if (score > hiScore) {
                hiScore = Math.floor(score);
                localStorage.setItem('dinoHiScore', hiScore);
                hiScoreEl.innerText = String(hiScore).padStart(5, '0');
            }
        }

        function resetGame() {
            obstacles.forEach(obs => scene.remove(obs)); obstacles = [];
            dino.position.y = floorY + (dinoHeight / 2);
            dinoVelocityY = 0; isJumping = false;
            gameOverScreen.style.display = 'none';
            startGame();
        }

        function checkCollisions() {
            const hitPadding = 0.3; 
            const dBox = {
                l: dino.position.x - (1.0 - hitPadding), r: dino.position.x + (1.0 - hitPadding),
                t: dino.position.y + (dinoHeight/2 - hitPadding), b: dino.position.y - (dinoHeight/2 - hitPadding)
            };

            for (let obs of obstacles) {
                const w = obs.userData.w / 2; const h = obs.userData.h / 2;
                const oBox = {
                    l: obs.position.x - w, r: obs.position.x + w,
                    t: obs.position.y + h, b: obs.position.y - h
                };
                if (dBox.l < oBox.r && dBox.r > oBox.l && dBox.t > oBox.b && dBox.b < oBox.t) {
                    gameOver(); break;
                }
            }
        }

        // --- RENDER LOOP ---
        let lastTime = performance.now();
        function animate() {
            requestAnimationFrame(animate);
            const time = performance.now();
            const delta = Math.min((time - lastTime) / 1000, 0.1); 
            lastTime = time;

            if (isPlaying) {
                // Physics
                if (isJumping) {
                    dinoVelocityY += gravity * delta;
                    dino.position.y += dinoVelocityY * delta;
                    if (dino.position.y <= floorY + (dinoHeight / 2)) {
                        dino.position.y = floorY + (dinoHeight / 2);
                        isJumping = false; dinoVelocityY = 0;
                    }
                }

                // Dino Leg Animation
                if (!isJumping) dino.material.map = (Math.floor(score * 2.5) % 2 === 0) ? texDino1 : texDino2;

                // Move Floor Texture
                texGround.offset.x += (gameSpeed * 0.05) * delta;

                // Move & Animate Obstacles
                for (let i = obstacles.length - 1; i >= 0; i--) {
                    let obs = obstacles[i];
                    obs.position.x -= gameSpeed * delta;
                    
                    // Bird flapping animation
                    if (obs.userData.type === 'bird') {
                        obs.material.map = (Math.floor(time / 150) % 2 === 0) ? texBirdUp : texBirdDown;
                    }

                    if (obs.position.x < -15) { scene.remove(obs); obstacles.splice(i, 1); }
                }

                // Move Parallax Clouds
                for (let i = clouds.length - 1; i >= 0; i--) {
                    clouds[i].mesh.position.x -= (gameSpeed * clouds[i].speed) * delta;
                    if (clouds[i].mesh.position.x < -20) { scene.remove(clouds[i].mesh); clouds.splice(i, 1); }
                }

                checkCollisions();
                score += delta * 12;
                scoreEl.innerText = String(Math.floor(score)).padStart(5, '0');
                gameSpeed += delta * 0.15;
            }

            renderer.render(scene, camera);
        }

        function onResize() {
            const aspect = window.innerWidth / window.innerHeight; const f = 16;
            camera.left = -f * aspect / 2; camera.right = f * aspect / 2;
            camera.top = f / 2; camera.bottom = -f / 2;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }
        window.onload = init;
    </script>
</body>
</html>
